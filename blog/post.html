<!DOCTYPE html>
<html lang="es">
<head>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <link rel="stylesheet" href="../css/style.css" />

</head>
<body>

<nav id="navbar">
  <a class="nav-logo" href="../">fn.gis</a>
  <div class="nav-right">
    <a href="index.html" class="nav-back">
      <span data-lang="es">← Blog</span>
      <span data-lang="en">← Blog</span>
    </a>
    <div class="lang-toggle">
      <button class="lang-btn" id="btnEn">EN</button>
      <button class="lang-btn" id="btnEs">ES</button>
    </div>
  </div>
</nav>

<div class="post-hero" id="postHero">
  <div class="post-meta" id="postMeta"></div>
  <h1 id="postTitle"></h1>
</div>

<article class="post-body" id="postBody">
  <p class="blog-loading">Cargando entrada...</p>
</article>

      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>

    <button class="share-btn share-copy" id="shareCopy" title="Copiar enlace">

        <span data-lang="en">Copy link</span>

<footer>
  <span>Fabio Neira Alzate · GIS Infrastructure Specialist · Medellín, Colombia</span>
  <span class="footer-built">
    <span data-lang="en">Built with ♥ · Hosted on GitHub Pages</span>
    <span data-lang="es">Hecho con ♥ · Alojado en GitHub Pages</span>
  </span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  let lang = localStorage.getItem('pref-lang') || 'es';
  const params = new URLSearchParams(window.location.search);
  const slug   = params.get('slug');

  function applyLang() {
    document.querySelectorAll('[data-lang]').forEach(el => {
      el.classList.toggle('on', el.dataset.lang === lang);
    });
    document.getElementById('btnEn').classList.toggle('active', lang === 'en');
    document.getElementById('btnEs').classList.toggle('active', lang === 'es');
    document.documentElement.lang = lang;
  }

  function reloadPost() {
    if (slug) {
      document.getElementById('postBody').innerHTML = '<p class="blog-loading">Cargando entrada...</p>';
      fetch(`posts/${slug}-${lang}.md`)
        .then(r => {
          if (!r.ok && lang !== 'es') {
            return fetch(`posts/${slug}-es.md`);
          }
          return r;
        })
        .then(r => r.text())
        .then(md => {
          marked.setOptions({ breaks: true, gfm: true });
          document.getElementById('postBody').innerHTML = marked.parse(md);
          document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
          document.getElementById('postTitle').textContent = meta.title[lang] || meta.title['es'];
          document.title = `${meta.title[lang] || meta.title['es']} — Fabio Neira Alzate`;
          applyLang();
        })
        .catch(renderNotFound);
    }
  }

  document.getElementById('btnEn').addEventListener('click', () => {
    lang = 'en'; localStorage.setItem('pref-lang', lang); reloadPost();
  });
  document.getElementById('btnEs').addEventListener('click', () => {
    lang = 'es'; localStorage.setItem('pref-lang', lang); reloadPost();
  });

  function renderNotFound() {
    document.getElementById('postBody').innerHTML = `
      <div class="post-not-found">
        <p>Entrada no encontrada. <a href="index.html">← Volver al blog</a></p>
      </div>`;
  }

  if (!slug) {
    renderNotFound();
  } else {
    fetch('posts.json')
      .then(r => r.json())
      .then(posts => {
        const meta = posts.find(p => p.slug === slug);
        if (!meta) { renderNotFound(); return; }

        // Update page title
        document.title = `${meta.title[lang]} — Fabio Neira Alzate`;

        // Render hero
        document.getElementById('postMeta').innerHTML =
          `<span class="blog-card-date post-date">${meta.date}</span>
           ${meta.tags.map(t => `<span class="blog-tag">${t}</span>`).join('')}`;
        document.getElementById('postTitle').textContent = meta.title[lang];

        // Fetch and render markdown (try current lang, fallback to spanish)
        return fetch(`posts/${slug}-${lang}.md`)
          .then(r => {
            if (!r.ok && lang !== 'es') {
              return fetch(`posts/${slug}-es.md`);
            }
            return r;
          });
      })
      .then(r => { if (!r || !r.ok) throw new Error(); return r.text(); })
      .then(md => {
        marked.setOptions({ breaks: true, gfm: true });
        document.getElementById('postBody').innerHTML = marked.parse(md);
        document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));

        // Share buttons — usar URL estática con OG tags
        const staticUrl = 'https://fanealSIG.github.io/blog/' + slug + '.html';
        const pageUrl   = encodeURIComponent(staticUrl);
        const postTitle = encodeURIComponent(document.getElementById('postTitle').textContent);
        document.getElementById('shareLinkedIn').href =
          'https://www.linkedin.com/sharing/share-offsite/?url=' + pageUrl;
        document.getElementById('shareTwitter').href =
          'https://twitter.com/intent/tweet?url=' + pageUrl + '&text=' + postTitle;
        document.getElementById('shareWhatsapp').href =
          'https://wa.me/?text=' + postTitle + '%20' + pageUrl;
        document.getElementById('postShare').classList.add('visible');

        document.getElementById('shareCopy').addEventListener('click', function() {
          navigator.clipboard.writeText(staticUrl).then(() => {
            this.classList.add('copied');
            setTimeout(() => this.classList.remove('copied'), 2200);
          });
        });

        applyLang();
      })
      .catch(renderNotFound);
  }

  applyLang();
</script>
</body>
</html>
